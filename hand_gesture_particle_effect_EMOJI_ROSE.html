const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

function makeSprite() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.75)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(c);
}
const spriteTex = makeSprite();

const STAR_COUNT = 900;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  starPos[i*3] = (Math.random()-0.5)*120;
  starPos[i*3+1] = (Math.random()-0.5)*120;
  starPos[i*3+2] = -Math.random()*90-5;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({
  size:2.0, sizeAttenuation:false, map:spriteTex,
  color:0x9ecbff, transparent:true, opacity:0.7,
  depthWrite:false, blending:THREE.AdditiveBlending
});
const backgroundStars = new THREE.Points(starGeo, starMat);
scene.add(backgroundStars);

const PARTICLE_COUNT = 270000;
const positions = new Float32Array(PARTICLE_COUNT*3);
const targets = new Float32Array(PARTICLE_COUNT*3);
const colorArr = new Float32Array(PARTICLE_COUNT*3);

for (let i=0; i<PARTICLE_COUNT*3; i++) {
  positions[i]=(Math.random()-0.5)*12;
  targets[i]=positions[i];
  colorArr[i]=1;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
geometry.setAttribute('color', new THREE.BufferAttribute(colorArr,3));

const material = new THREE.PointsMaterial({
  size:0.018, map:spriteTex, vertexColors:true,
  transparent:true, opacity:1.0, depthWrite:false,
  blending:THREE.AdditiveBlending, sizeAttenuation:true
});

const particles = new THREE.Points(geometry,material);
scene.add(particles);

let targetScale=1,currentScale=1;
let targetPanX=0,currentPanX=0;
let targetPanY=0,currentPanY=0;

function setSolidColor(hex) {
  const c=new THREE.Color(hex);
  const arr=geometry.attributes.color.array;
  for(let i=0;i<PARTICLE_COUNT;i++){
    arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b;
  }
  geometry.attributes.color.needsUpdate=true;
}

let isFlatShape=false;

function setCloud() {
  isFlatShape=false;
  setSolidColor(0x2bd2ff);
  for(let i=0;i<PARTICLE_COUNT;i++){
    targets[i*3]=(Math.random()-0.5)*8;
    targets[i*3+1]=(Math.random()-0.5)*8;
    targets[i*3+2]=(Math.random()-0.5)*8;
  }
}

function setSphere() {
  isFlatShape=false;
  setSolidColor(0xff8a1e);
  const R=1.6;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    const r=R*(0.94+Math.random()*0.06);
    targets[i*3]=r*Math.sin(phi)*Math.cos(theta);
    targets[i*3+1]=r*Math.cos(phi);
    targets[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
}

function setHeart() {
  isFlatShape=true;
  setSolidColor(0xff2d6f);
  const S=0.085, CY=-2.5;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const t=Math.random()*Math.PI*2;
    const r=Math.sqrt(Math.random());
    const hx=16*Math.pow(Math.sin(t),3);
    const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    targets[i*3]=hx*r*S;
    targets[i*3+1]=(CY+(hy-CY)*r)*S;
    targets[i*3+2]=(Math.random()-0.5)*0.35;
  }
}

function setText() {
  isFlatShape = true;
  setSolidColor(0x00ffff);

  const W = 900, H = 260;
  const c2 = document.createElement('canvas');
  c2.width = W;
  c2.height = H;

  const ctx = c2.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 118px Arial, Helvetica, sans-serif';
  ctx.fillText('I LOVE YOU', W / 2, H / 2);

  const data = ctx.getImageData(0, 0, W, H).data;
  const pts = [];

  // Dense sampling keeps every letter readable.
  for (let y = 0; y < H; y += 1) {
    for (let x = 0; x < W; x += 1) {
      const a = data[(y * W + x) * 4 + 3];
      if (a > 100) {
        pts.push({
          x: (x - W / 2) / 125,
          y: -(y - H / 2) / 125
        });
      }
    }
  }

  if (pts.length === 0) {
    setCloud();
    return false;
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = pts[i % pts.length];
    targets[i*3]     = p.x + (Math.random() - 0.5) * 0.006;
    targets[i*3 + 1] = p.y + (Math.random() - 0.5) * 0.006;
    targets[i*3 + 2] = (Math.random() - 0.5) * 0.035;
  }
  return true;
}

function setRose() {
  // Rose is rendered directly from the 🌹 emoji, then converted to particles.
  // This keeps the rose symbol clean and immediately recognizable.
  isFlatShape = true;

  const W = 420, H = 420;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });

  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '300px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  ctx.fillText('🌹', W / 2, H / 2 + 12);

  const data = ctx.getImageData(0, 0, W, H).data;
  const pts = [];

  for (let y = 0; y < H; y += 1) {
    for (let x = 0; x < W; x += 1) {
      const idx = (y * W + x) * 4;
      if (data[idx + 3] > 70) {
        pts.push({
          x: (x - W / 2) / 105,
          y: -(y - H / 2) / 105,
          r: data[idx] / 255,
          g: data[idx + 1] / 255,
          b: data[idx + 2] / 255
        });
      }
    }
  }

  if (!pts.length) {
    setSolidColor(0xff1744);
    return false;
  }

  const colorAttr = geometry.attributes.color;
  const cArr = colorAttr.array;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = pts[i % pts.length];
    targets[i * 3]     = p.x;
    targets[i * 3 + 1] = p.y;
    targets[i * 3 + 2] = (Math.random() - 0.5) * 0.025;

    cArr[i * 3]     = p.r;
    cArr[i * 3 + 1] = p.g;
    cArr[i * 3 + 2] = p.b;
  }

  colorAttr.needsUpdate = true;
  return true;
}

function setImageShape(img) {
  if(!img)return false;
  isFlatShape=true;
  // Higher-resolution sampling makes the photo much easier to recognize.
  // 300px working width + 1px sampling gives a much denser source point map.
  const MAX_W=520, STEP=1;
  const scl=Math.min(1,MAX_W/img.width);
  const w=Math.max(4,Math.floor(img.width*scl));
  const h=Math.max(4,Math.floor(img.height*scl));

  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,w,h);

  let data;
  try { data=ctx.getImageData(0,0,w,h).data; }
  catch(e){ console.error('Image read error:',e); return false; }

  const pts=[];
  for(let y=0;y<h;y+=STEP){
    for(let x=0;x<w;x+=STEP){
      const idx=(y*w+x)*4;
      if(data[idx+3]>100){
        pts.push({
          x:x-w/2,y:-(y-h/2),
          r:data[idx]/255,g:data[idx+1]/255,b:data[idx+2]/255
        });
      }
    }
  }
  if(pts.length===0)return false;

  const maxDim=Math.max(w,h);
  const fit=4.2/maxDim;
  const colorAttr=geometry.attributes.color;
  const cArr=colorAttr.array;

  // Spread particles across the whole image instead of repeatedly
  // sampling random points. This preserves facial features, clothing,
  // ball, bridge, trees and other details much more clearly.
  const order = new Uint32Array(pts.length);
  for(let i=0;i<pts.length;i++) order[i]=i;

  // Fisher-Yates shuffle once for an even, natural distribution.
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  }

  for(let i=0;i<PARTICLE_COUNT;i++){
    const p=pts[order[i % order.length]];
    targets[i*3]=p.x*fit;
    targets[i*3+1]=p.y*fit;
    targets[i*3+2]=(Math.random()-0.5)*0.045;

    cArr[i*3]=p.r;
    cArr[i*3+1]=p.g;
    cArr[i*3+2]=p.b;
  }
  colorAttr.needsUpdate=true;
  return true;
}

const loadedImages={1:null,2:null};

function initImages(){
  const img1=new Image();
  img1.onload=()=>{loadedImages[1]=img1;};
  img1.onerror=()=>console.error('Photo 1 could not be loaded');
  img1.src=IMAGE_1_BASE64;

  const img2=new Image();
  img2.onload=()=>{loadedImages[2]=img2;};
  img2.onerror=()=>console.error('Photo 2 could not be loaded');
  img2.src=IMAGE_2_BASE64;
}
initImages();

const SHAPES={
  heart:setHeart,
  sphere:setSphere,
  text:setText,
  cloud:setCloud,
  rose:setRose,
  image1:()=>loadedImages[1]?setImageShape(loadedImages[1]):setSphere(),
  image2:()=>loadedImages[2]?setImageShape(loadedImages[2]):setText()
};

let currentShape='cloud';
let candidateShape=null;
let candidateFrames=0;
const STABLE_FRAMES=4;

function applyShape(name){
  if(!SHAPES[name])return;
  if(name===currentShape)return;
  const ok=SHAPES[name]();
  if(ok!==false)currentShape=name;
}

const GESTURE_LABEL={
  heart:'✊ Fist → Heart',
  image1:'☝️ 1 Finger → Photo 1',
  image2:'✌️ 2 Fingers → Photo 2',
  rose:'🤟 3 Fingers → Rose',
  text:'🖐 4 Fingers + Thumb Closed → I LOVE YOU',
  cloud:'🖐 Full Open Hand → Cloud'
};

setCloud();

const videoElement=document.querySelector('.input_video');
const canvasElement=document.getElementById('webcam_canvas');
const canvasCtx=canvasElement.getContext('2d');
const gestureStatus=document.getElementById('gesture-status');

function dist2D(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function onResults(results){
  canvasCtx.save();
  canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height);
  canvasCtx.drawImage(results.image,0,0,canvasElement.width,canvasElement.height);
  canvasCtx.restore();

  const hands=results.multiHandLandmarks;

  if(hands&&hands.length>0){
    const lm=hands[0];
    const W=canvasElement.width,H=canvasElement.height;

    canvasCtx.fillStyle='rgba(0,255,255,0.9)';
    for(let i=0;i<lm.length;i++){
      canvasCtx.beginPath();
      canvasCtx.arc(lm[i].x*W,lm[i].y*H,3,0,Math.PI*2);
      canvasCtx.fill();
    }

    canvasCtx.fillStyle='rgba(255,45,111,0.95)';
    canvasCtx.beginPath();
    canvasCtx.arc(lm[9].x*W,lm[9].y*H,5,0,Math.PI*2);
    canvasCtx.fill();

    const wrist=lm[0];
    const fingers=[[8,6],[12,10],[16,14],[20,18]];
    const open=fingers.map(([tip,pip])=>
      dist2D(lm[tip],wrist)>dist2D(lm[pip],wrist)*1.15
    );
    const thumbOpen=dist2D(lm[4],lm[5])>dist2D(lm[2],lm[5])*0.9;
    const openCount=open.filter(Boolean).length;

    let gesture=null;
    if(openCount===0&&!thumbOpen)gesture='heart';
    else if(openCount===1&&open[0]&&!open[1])gesture='image1';
    else if(openCount===2&&open[0]&&open[1]&&!open[2])gesture='image2';
    else if(openCount===3&&open[0]&&open[1]&&open[2]&&!open[3])gesture='rose';
    else if(openCount===4&&!thumbOpen)gesture='text';
    else if(openCount===4&&thumbOpen)gesture='cloud';

    if(gesture){
      if(gesture===candidateShape)candidateFrames++;
      else{candidateShape=gesture;candidateFrames=1;}
      if(candidateFrames>=STABLE_FRAMES)applyShape(gesture);
      gestureStatus.innerText='Gesture: '+(GESTURE_LABEL[gesture]||gesture);
    }else{
      gestureStatus.innerText='Gesture: Hold a pose...';
      candidateShape=null;
      candidateFrames=0;
    }

    const palmSize=dist2D(lm[0],lm[9]);
    targetScale=THREE.MathUtils.clamp(palmSize*4.2,0.45,2.8);
    targetPanX=(0.5-lm[9].x)*4.5;
    targetPanY=(0.5-lm[9].y)*4.5;
  }else{
    gestureStatus.innerText='Gesture: No hand detected';
    candidateShape=null;
    candidateFrames=0;
    targetScale=1;
    targetPanX=0;
    targetPanY=0;
  }
}

const hands=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.6,
  minTrackingConfidence:0.6
});
hands.onResults(onResults);

const cameraUtils=new Camera(videoElement,{
  onFrame:async()=>{
    if(videoElement.videoWidth&&canvasElement.width!==videoElement.videoWidth){
      canvasElement.width=videoElement.videoWidth;
      canvasElement.height=videoElement.videoHeight;
    }
    await hands.send({image:videoElement});
  },
  width:640,
  height:480
});
cameraUtils.start().catch(err=>{
  console.error(err);
  gestureStatus.innerText='Camera error — allow camera access';
});

const posAttr=geometry.attributes.position;

function animate(){
  requestAnimationFrame(animate);
  const arr=posAttr.array;
  for(let i=0;i<PARTICLE_COUNT*3;i++){
    arr[i]+=(targets[i]-arr[i])*0.18;
  }
  posAttr.needsUpdate=true;

  currentScale+=(targetScale-currentScale)*0.08;
  particles.scale.setScalar(currentScale);

  currentPanX+=(targetPanX-currentPanX)*0.08;
  currentPanY+=(targetPanY-currentPanY)*0.08;
  particles.position.set(currentPanX,currentPanY,0);

  if(isFlatShape){
    particles.rotation.y+=(0-particles.rotation.y)*0.12;
    particles.rotation.x+=(0-particles.rotation.x)*0.12;
  }else{
    particles.rotation.y+=0.0035;
    particles.rotation.x+=(0-particles.rotation.x)*0.06;
  }

  backgroundStars.rotation.y+=0.0004;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  renderer.setSize(w,h);
});
</script>
</body>
</html>
